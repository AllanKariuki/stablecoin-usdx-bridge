# NATS server configuration for the DAMP platform (H7).
#
# Before H7 the server ran with no authentication at all (-js -sd /data -m
# 8222) and who may publish was decided by nats-networkpolicy.yaml alone —
# which does not make a publish trustworthy: anything already inside the
# network (any second team's workload, any compromised pod) could put a
# message in front of a customer (live.notifications.push.v1) or poison the
# DAMP stream. This file is the fix: every client connects with its own
# user, and each user may publish and subscribe only the subjects its role
# needs.
#
# One account, three users. Accounts are for isolating *entire namespaces*
# from each other; here all three services share one event stream (DAMP),
# which is what makes per-user subject permissions — not per-account
# isolation — the right tool. JetStream streams are account-scoped, so
# splitting the users across accounts would split the stream too.
#
# Passwords come from the environment ($NATS_..._PASSWORD) so no secret is
# ever committed; docker-compose.yaml passes the dev values. A deployment
# that forgets one fails at NATS startup ("cannot parse configuration" or a
# refused connection), not silently with no auth.
#
# Client port 4222, monitor port 8222 (compose publishes them as 54222 /
# 58222; the container side stays the ports every manifest and config file
# already names).

port: 4222
http_port: 8222

jetstream {
  # The same data directory the -sd /data command line used: JetStream state
  # — the DAMP stream, every consumer's cursor — survives the switch to this
  # file unchanged.
  store_dir: "/data"
}

# Least privilege: no user may delete or purge a stream or consumer. JetStream
# API subjects are listed per operation each client actually performs.
authorization {
  users = [
    # core-ledger's worker: the outbox relay. Publishes the platform's
    # domain events and creates/updates the DAMP stream (idempotently, on
    # every boot). $JS.API.> is the request surface for
    # CreateOrUpdateStream (STREAM.CREATE/UPDATE/INFO on DAMP); publishes
    # are answered on the relay's _INBOX, which is why it may subscribe
    # there. It never reads damp.> — it writes it.
    {
      user: core-ledger
      password: $NATS_CORE_LEDGER_PASSWORD
      permissions: {
        publish: {
          allow: ["damp.>", "$JS.API.INFO", "$JS.API.STREAM.CREATE.DAMP", "$JS.API.STREAM.UPDATE.DAMP", "$JS.API.STREAM.INFO.DAMP"]
        }
        subscribe: {
          allow: ["_INBOX.>"]
        }
      }
    }

    # notifications: two roles on one connection. (1) The
    # notifications-outbox durable on DAMP — pull consumer API calls, acks
    # and delivery on its inbox. (2) Core pub/sub on
    # live.notifications.push.v1, which every replica publishes AND
    # subscribes to (fan-out is deliberately outside damp.> so pushes are
    # never persisted). It may read damp.> but never publish there: an
    # event the ledger did not produce must not enter the platform's event
    # log under the ledger's subjects.
    {
      user: notifications
      password: $NATS_NOTIFICATIONS_PASSWORD
      permissions: {
        publish: {
          allow: ["live.notifications.push.v1", "$JS.API.INFO", "$JS.API.CONSUMER.CREATE.DAMP.>", "$JS.API.CONSUMER.DURABLE.CREATE.DAMP.>", "$JS.API.CONSUMER.INFO.DAMP.>", "$JS.API.CONSUMER.MSG.NEXT.DAMP.>", "$JS.API.STREAM.INFO.DAMP", "$JS.ACK.DAMP.>"]
        }
        subscribe: {
          allow: ["damp.>", "live.notifications.push.v1", "_INBOX.>"]
        }
      }
    }

    # compliance: the H6 enforcement-finality consumer, and nothing else.
    # The durable compliance-enforcement is filtered to
    # damp.ledger.chain_enforcement_finalized.v1, so that one subject plus
    # the consumer API/ack/inbox surface is all it needs. A compliance pod
    # must not be able to publish ledger events, live pushes, or anything
    # else on damp.>.
    {
      user: compliance
      password: $NATS_COMPLIANCE_PASSWORD
      permissions: {
        publish: {
          allow: ["$JS.API.INFO", "$JS.API.CONSUMER.CREATE.DAMP.>", "$JS.API.CONSUMER.DURABLE.CREATE.DAMP.>", "$JS.API.CONSUMER.INFO.DAMP.>", "$JS.API.CONSUMER.MSG.NEXT.DAMP.>", "$JS.API.STREAM.INFO.DAMP", "$JS.ACK.DAMP.>"]
        }
        subscribe: {
          allow: ["damp.ledger.chain_enforcement_finalized.v1", "_INBOX.>"]
        }
      }
    }
  ]
}

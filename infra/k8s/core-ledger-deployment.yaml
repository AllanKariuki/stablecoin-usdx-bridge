apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-ledger
  labels:
    app: core-ledger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: core-ledger
  template:
    metadata:
      labels:
        app: core-ledger
    spec:
      containers:
        - name: core-ledger
          image: <Image>
          ports:
            - containerPort: 8281
          envFrom:
            - secretRef:
                name: core-ledger-secrets
          resources:
            limits:
              memory: "128Mi"
              cpu: "500m"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: core-ledger-secrets
                  key: database_uri
          

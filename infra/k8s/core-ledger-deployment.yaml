apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-ledger
  labels:
    app: core-ledger
spec:
  # The saga reason for this cap is gone as of P2: this process no longer
  # runs sagas at all, it enqueues them, and core-ledger-worker claims them
  # under a lease plus a pg_try_advisory_lock on the correlation id.
  #
  # Still 1, for a different reason: cmd/server/main.go's reconciliation
  # ticker runs once per replica, so a second one doubles every comparison and
  # every alert. P3 extracts it into a leader-elected CronJob, and this can go
  # up then. See infra/k8s/core-ledger-worker-deployment.yaml, which is
  # already at 2.
  replicas: 1
  selector:
    matchLabels:
      app: core-ledger
  template:
    metadata:
      labels:
        app: core-ledger
    spec:
      containers:
        - name: core-ledger
          # TODO(P0): point at the real registry once CI publishes an image,
          # e.g. ghcr.io/allankariuki/stablecoin-usdx-bridge/core-ledger:<tag>
          image: <Image>
          ports:
            - containerPort: 8081
          envFrom:
            - secretRef:
                name: core-ledger-secrets
          env:
            - name: PORT
              value: "8081"
            - name: AUTH_ISSUER_URL
              value: "http://keycloak.default.svc.cluster.local:8080/realms/damp"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: core-ledger-secrets
                  key: database_uri
            # H4: the server proposes break-glass approvals to
            # services/workflow, carrying svc-core-ledger's token
            # (workflow.propose) — the worker keeps its own client and its
            # own secret key below in core-ledger-worker-deployment.yaml.
            - name: SERVICE_CLIENT_ID
              value: "svc-core-ledger"
            - name: SERVICE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: core-ledger-secrets
                  key: server-service-client-secret
            - name: KEYCLOAK_BASE_URL
              value: "http://keycloak.default.svc.cluster.local:8080"
            - name: KEYCLOAK_REALM
              value: "damp"
            - name: WORKFLOW_URL
              value: "http://workflow.default.svc.cluster.local:3006"
            # Where workflow posts decisions back. Must be the Service name,
            # not a pod IP: the callback is retried over minutes and the pod
            # that proposed may be long gone by the time it is approved.
            - name: CORE_LEDGER_SELF_URL
              value: "http://core-ledger.default.svc.cluster.local:8081"
            # The HMAC workflow signs its decision callbacks with — the same
            # Secret kyc and compliance read theirs from.
            - name: WORKFLOW_CALLBACK_SECRET
              valueFrom:
                secretKeyRef: { name: workflow-callback, key: secret }
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          # Liveness never touches a dependency (shared/go/platform's
          # /healthz is a static 200) — a slow Postgres should take this
          # pod out of rotation via readiness, not trigger a kubelet
          # restart. Readiness (/readyz) does check the DB and degrades to
          # 503 while it's unreachable — see shared/go/platform/health.go.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          # Give graceful shutdown's 5s drain + up to 15s bounded
          # ShutdownWithContext room to finish before SIGKILL — see
          # shared/go/platform/shutdown.go's defaults.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
      terminationGracePeriodSeconds: 30

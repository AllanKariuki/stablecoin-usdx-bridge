apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing
  labels:
    app: pricing
spec:
  # One replica. The aggregator has no leader election of its own, and two
  # replicas would double-poll every feed — harmless against free public
  # tickers, but each replica also keeps its own observation state, so a
  # quote could price from different data depending on which pod served it.
  # Scale out only with a shared cache for observations, or a single
  # replica behind a wider HPA.
  replicas: 1
  selector:
    matchLabels:
      app: pricing
  template:
    metadata:
      labels:
        app: pricing
    spec:
      containers:
        - name: pricing
          # TODO: point at the real registry once CI publishes an image.
          image: <Image>
          ports:
            - containerPort: 3006
          envFrom:
            - secretRef:
                name: pricing-secrets
          env:
            - name: PORT
              value: "3006"
            - name: DATABASE_URL
              value: "postgres://pricing:pricing@postgres.default.svc.cluster.local:5432/pricing?sslmode=disable"
            - name: CORE_LEDGER_URL
              value: "http://core-ledger.default.svc.cluster.local:8081"
            # rms' exposure check: every crypto-legged quote is bounded
            # against the house's position before it is minted, and the
            # guard fails closed when rms is unreachable.
            - name: RMS_URL
              value: "http://rms.default.svc.cluster.local:3005"
            # Service-account credentials for core-ledger (H2): core-ledger
            # rejects any POST /fx/quotes without a svc-pricing bearer token
            # — quote creation is locked to this one client's role.
            - name: SERVICE_CLIENT_ID
              value: "svc-pricing"
            - name: SERVICE_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: pricing-secrets, key: service-client-secret }
            - name: KEYCLOAK_BASE_URL
              value: "http://keycloak.default.svc.cluster.local:8080"
            - name: KEYCLOAK_REALM
              value: "damp"
            # H3: every request must carry a service-account JWT with
            # audience `pricing`.
            - name: AUTH_ISSUER_URL
              value: "http://keycloak.default.svc.cluster.local:8080/realms/damp"
            - name: AUTH_AUDIENCE
              value: "pricing"
            # Live feeds in the cluster: two independent crypto venues plus
            # the fiat reference rate.
            - name: PRICING_FEEDS
              value: "coinbase,kraken,fiat"
            # services/audit-trail. audit_outbox rows are written in the same
            # transaction as each pair-policy change; this relay delivers
            # them. The token is audit-trail's INGEST_TOKEN — one Secret,
            # shared by every producer and the receiver.
            - name: AUDIT_TRAIL_URL
              value: "http://audit-trail.default.svc.cluster.local:8085"
            - name: AUDIT_TRAIL_TOKEN
              valueFrom:
                secretKeyRef: { name: audit-trail-ingest, key: token }
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3006
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3006
            initialDelaySeconds: 5
            periodSeconds: 10
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: pricing
  labels:
    app: pricing
spec:
  selector:
    app: pricing
  ports:
    - name: http
      protocol: TCP
      port: 3006
      targetPort: 3006

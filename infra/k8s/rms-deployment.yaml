apiVersion: apps/v1
kind: Deployment
metadata:
  name: rms
  labels:
    app: rms
spec:
  # One replica while CUSTODIAN_POLL_ENABLED is true. The poller has no
  # leader election of its own, and two replicas would double-poll every
  # custodian — harmless for the stub (the statement upserts on
  # (custodian, currency, as_of) and core-ledger's Idempotency-Key replays
  # the first post) but wasteful against a real bank adapter with a rate
  # limit. Scale out by setting CUSTODIAN_POLL_ENABLED=false on the extra
  # replicas, or give the poller the same advisory lock the indexer uses.
  replicas: 1
  selector:
    matchLabels:
      app: rms
  template:
    metadata:
      labels:
        app: rms
    spec:
      containers:
        - name: rms
          # TODO: point at the real registry once CI publishes an image.
          image: <Image>
          ports:
            - containerPort: 3005
          envFrom:
            - secretRef:
                name: rms-secrets
          env:
            - name: PORT
              value: "3005"
            - name: DATABASE_URL
              value: "postgres://rms:rms@postgres.default.svc.cluster.local:5432/rms?sslmode=disable"
            - name: CORE_LEDGER_URL
              value: "http://core-ledger.default.svc.cluster.local:8081"
            - name: CUSTODIAN_POLL_ENABLED
              value: "true"
            - name: CUSTODIAN_POLL_SECONDS
              value: "60"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3005
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3005
            initialDelaySeconds: 5
            periodSeconds: 10
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: rms
  labels:
    app: rms
spec:
  selector:
    app: rms
  ports:
    - name: http
      protocol: TCP
      port: 3005
      targetPort: 3005

apiVersion: v1
kind: Service
metadata:
  name: auth-proxy
spec:
  selector:
    app: auth-proxy
  ports:
    - port: 80
      targetPort: 8090
  # Not LoadBalancer/NodePort — only Traefik's ForwardAuth middleware calls
  # this, cluster-internally (see infra/traefik/dynamic.yaml's
  # require-auth.forwardAuth.address for the local-dev equivalent). Same
  # posture as core-ledger's own ClusterIP-only service.
  type: ClusterIP

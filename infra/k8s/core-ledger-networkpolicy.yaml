# Closes the gap the P1 DoD names explicitly (docs/building-plan.md):
# "a forged X-User-Id against :8082 is rejected, and :8081 isn't
# reachable." auth-proxy enforces the first half at the application layer;
# this enforces the second half at the network layer — core-ledger accepts
# traffic only from the pod that actually calls it directly, never from
# outside the cluster and never from an arbitrary pod bypassing the
# gateway.
#
# Traffic path, now that services/bff exists: Traefik calls auth-proxy's
# /verify as a side call (a decision, not a proxy hop — see
# infra/traefik/dynamic.yaml's require-auth middleware), then forwards the
# request to bff, which is the one that calls core-ledger (see
# services/bff/src/core-ledger/core-ledger.client.ts) — the frontend never
# reaches core-ledger directly, and neither does Traefik anymore (local dev's
# dynamic.yaml routes /api straight to bff). `app: bff` is real —
# infra/k8s/bff isn't created yet (bff runs via local docker-compose/pnpm
# today, no k8s Deployment), so this is forward-looking the same way
# core-ledger's own Deployment was before this policy existed, but the label
# itself matches what that future manifest's pod labels will be.
#
# A NetworkPolicy's podSelector-based rules are additive only (there's no
# explicit "deny" verb) — as soon as any NetworkPolicy selects a pod, that
# pod's ingress becomes default-deny except for what's explicitly allowed
# here. This assumes a CNI plugin that enforces NetworkPolicy (Calico,
# Cilium, etc. — not the no-op default on managed clusters without one
# enabled).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: core-ledger-ingress
spec:
  podSelector:
    matchLabels:
      app: core-ledger
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: bff
      ports:
        - protocol: TCP
          port: 8081

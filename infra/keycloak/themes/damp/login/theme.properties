kcSelectAuthListItemHeadingClass=damp-select-heading
kcSelectAuthListItemDescriptionClass=damp-select-desc
kcSelectAuthListItemFillClass=damp-select-fill
kcSelectAuthListItemArrowClass=damp-select-arrow
kcSelectAuthListItemArrowIconClass=damp-icon-chevron

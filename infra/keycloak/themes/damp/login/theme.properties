# DAMP login theme. It extends `base` (unstyled templates) instead of
# `keycloak` (PatternFly), so the only stylesheet is resources/css/damp.css,
# whose tokens are copied from frontend/shared/src/styles/theme.css. Pages
# this theme doesn't override (OTP, reset, update-profile, config-totp, error,
# info…) render inside template.ftl with the classes mapped below.
parent=base
import=common/keycloak

styles=css/damp.css
meta=viewport==width=device-width,initial-scale=1

kcHtmlClass=damp
kcBodyClass=damp-body
kcLoginClass=damp-login
kcFormCardClass=damp-card
kcFormHeaderClass=damp-card-header

kcFormClass=damp-form
kcFormGroupClass=damp-field
kcFormSettingClass=damp-form-settings
kcLabelWrapperClass=damp-label-wrap
kcLabelClass=damp-label
kcInputWrapperClass=damp-input-wrap
kcInputClass=damp-input
kcInputGroup=damp-input-group
kcInputErrorMessageClass=damp-field-error
kcInputHelperTextBeforeClass=damp-hint
kcInputHelperTextAfterClass=damp-hint
kcInputClassRadio=damp-choice
kcInputClassRadioInput=damp-choice-input
kcInputClassRadioLabel=damp-choice-label
kcInputClassCheckbox=damp-choice
kcInputClassCheckboxInput=damp-choice-input
kcInputClassCheckboxLabel=damp-choice-label
kcCheckboxInputClass=damp-choice-input
kcContentWrapperClass=damp-content-wrap

kcFormOptionsClass=damp-form-options
kcFormOptionsWrapperClass=damp-form-options-links
kcFormButtonsClass=damp-form-buttons
kcButtonClass=damp-btn
kcButtonPrimaryClass=damp-btn-primary
kcButtonDefaultClass=damp-btn-secondary
kcButtonBlockClass=damp-btn-block
kcButtonLargeClass=damp-btn-lg

kcFormPasswordVisibilityButtonClass=damp-reveal
kcFormPasswordVisibilityIconShow=damp-icon-eye
kcFormPasswordVisibilityIconHide=damp-icon-eye-off

kcAlertClass=damp-alert
kcAlertTitleClass=damp-alert-text
kcFeedbackSuccessIcon=damp-icon-ok
kcFeedbackWarningIcon=damp-icon-warn
kcFeedbackErrorIcon=damp-icon-warn
kcFeedbackInfoIcon=damp-icon-info

kcSignUpClass=damp-signup
kcInfoAreaWrapperClass=damp-info

kcFormSocialAccountSectionClass=damp-social
kcFormSocialAccountListClass=damp-social-list
kcFormSocialAccountListGridClass=damp-social-grid
kcFormSocialAccountListButtonClass=damp-btn damp-btn-secondary damp-btn-block
kcFormSocialAccountNameClass=damp-social-name

kcLoginOTPListClass=damp-otp-list
kcLoginOTPListInputClass=damp-otp-input
kcLoginOTPListItemHeaderClass=damp-otp-item
kcLoginOTPListItemIconBodyClass=damp-otp-icon

services:
  postgres:
    image: postgres:16-alpine
    container_name: usdx-postgres
    ports:
      - "55433:5432"
    environment:
      POSTGRES_USER: bridge
      POSTGRES_PASSWORD: bridge
      POSTGRES_DB: bridge
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Only applied on a fresh (empty) pgdata volume — see
      # infra/postgres/init/01-identity-db.sql's own comment.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bridge}"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: usdx-keycloak
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # dev-file storage (embedded, on the container's own volume) is
      # intentional here — a dedicated Postgres for Keycloak is more
      # infrastructure than local dev needs; --import-realm re-seeds it from
      # infra/keycloak/realms/damp-realm.json on every fresh start anyway.
    volumes:
      - ./infra/keycloak/realms:/opt/keycloak/data/import:ro
      - kcdata:/opt/keycloak/data

  redis:
    image: redis:7-alpine
    container_name: usdx-redis
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  traefik:
    image: traefik:v3.1
    container_name: usdx-traefik
    ports:
      - "8082:8082"
    volumes:
      - ./infra/traefik/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ./infra/traefik/dynamic.yaml:/etc/traefik/dynamic.yaml:ro
    command: ["--configFile=/etc/traefik/traefik.yaml"]
    extra_hosts:
      # host.docker.internal is built into Docker Desktop on macOS/Windows;
      # explicit on Linux, where it isn't automatic.
      - "host.docker.internal:host-gateway"

  # ---------------------------------------------------------------------
  # Application containers, behind the "app" profile so a plain
  # `docker compose up -d` still brings up infrastructure only and leaves
  # core-ledger to `make run` on the host, which is the faster inner loop.
  #
  #   docker compose --profile app up -d --build
  #
  # The worker is a container rather than a goroutine specifically so P2's
  # definition of done can be performed: start an issuance, `docker kill
  # usdx-worker` while it is in flight, restart it, and watch the transfer
  # reach COMPLETED without minting twice.
  # ---------------------------------------------------------------------

  core-ledger:
    profiles: ["app"]
    build:
      context: .
      dockerfile: core-ledger/Dockerfile
    image: usdx/core-ledger:dev
    container_name: usdx-core-ledger
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - core-ledger/.env
    environment:
      # Overrides .env's host-side DSN: inside the compose network Postgres
      # answers on its service name and its own port, not the published one.
      DATABASE_URL: postgres://bridge:bridge@postgres:5432/bridge?sslmode=disable
      SOLANA_RELAYER_KEYPAIR_PATH: /app/solana-relayer.json
    volumes:
      - ${SOLANA_RELAYER_KEYPAIR_HOST_PATH:-./chains/solana/deploy/relayer.json}:/app/solana-relayer.json:ro
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/readyz"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    profiles: ["app"]
    image: usdx/core-ledger:dev
    container_name: usdx-worker
    entrypoint: ["/usr/local/bin/core-ledger-worker"]
    depends_on:
      postgres:
        condition: service_healthy
      core-ledger:
        # The API runs the migrations and seeds the chart of accounts; the
        # worker only posts against it.
        condition: service_started
    env_file:
      - core-ledger/.env
    environment:
      DATABASE_URL: postgres://bridge:bridge@postgres:5432/bridge?sslmode=disable
      SOLANA_RELAYER_KEYPAIR_PATH: /app/solana-relayer.json
      WORKER_PORT: "8181"
    volumes:
      - ${SOLANA_RELAYER_KEYPAIR_HOST_PATH:-./chains/solana/deploy/relayer.json}:/app/solana-relayer.json:ro
    ports:
      - "8181:8181"
    # No graceful stop on `docker kill` is the point of the exercise: leases
    # lapse and another worker — or this one, restarted — picks the saga up.
    stop_grace_period: 30s

volumes:
  pgdata:
  kcdata:
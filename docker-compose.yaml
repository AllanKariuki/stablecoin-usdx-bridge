services:
  postgres:
    image: timescale/timescaledb:latest-pg14
    container_name: usdx-postgres
    ports:
      - "55433:5432"
    environment:
      POSTGRES_USER: usdx
      POSTGRES_PASSWORD: usdxPass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-usdx}"]
      interval: 5s
      timeout: 3s
      retries: 20
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Go workspace (core-ledger, shared/go/platform, shared/authz,
  # services/auth-proxy) — one job, since go.work makes them one build.
  # core-ledger's integration tests run against a real Postgres service
  # container; a skipped one fails the job (see the final step) rather
  # than passing silently — this mirrors `make test-integration` locally.
  # ---------------------------------------------------------------------
  go:
    name: Go workspace
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bridge
          POSTGRES_PASSWORD: bridge
          POSTGRES_DB: bridge
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U bridge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work

      - name: go vet
        run: go vet ./core-ledger/... ./shared/go/platform/... ./shared/authz/... ./services/auth-proxy/...

      - name: go test (unit + integration)
        env:
          LEDGER_TEST_DATABASE_URL: postgres://bridge:bridge@localhost:55433/bridge?sslmode=disable
        run: |
          set -euo pipefail
          go test ./core-ledger/... ./shared/go/platform/... ./shared/authz/... ./services/auth-proxy/... -count=1 -race -v 2>&1 | tee /tmp/go-test.log
          if grep -q '^--- SKIP: TestIntegration' /tmp/go-test.log; then
            echo "::error::an integration test was skipped — LEDGER_TEST_DATABASE_URL must be reachable in CI"
            exit 1
          fi

      - name: authz-gen produces no drift
        # permissions.yaml is the single source of truth (see
        # shared/authz/permissions.yaml) — this catches someone hand-editing
        # a generated file, or editing permissions.yaml without re-running
        # `make authz-gen` before committing.
        run: |
          go run ./shared/authz/gen
          git diff --exit-code shared/authz/generated/ || {
            echo "::error::shared/authz/generated/ is stale — run 'make authz-gen' and commit the result"
            exit 1
          }

  # ---------------------------------------------------------------------
  # Node workspace (shared/node/nest-platform, services/bff,
  # services/identity) — one pnpm workspace, one job. identity's e2e specs
  # need a real Postgres (see services/identity/test/fixtures/bootstrap.ts,
  # mirroring the Go job's own LEDGER_TEST_DATABASE_URL reasoning); bff and
  # nest-platform's specs are self-contained (fakes / in-process fixtures)
  # but running everything through one `pnpm -r` catches a workspace-wide
  # break in any of the three, not just identity's.
  # ---------------------------------------------------------------------
  node:
    name: Node workspace (pnpm)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bridge
          POSTGRES_PASSWORD: bridge
          POSTGRES_DB: bridge
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U bridge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Create identity's databases
        # GitHub Actions service containers don't support mounting
        # docker-entrypoint-initdb.d/ the way docker-compose.yaml does (see
        # infra/postgres/init/01-identity-db.sql) — this is that same SQL,
        # run by hand against the already-running service container.
        run: |
          PGPASSWORD=bridge psql -h localhost -p 55433 -U bridge -d bridge \
            -c "CREATE ROLE identity WITH LOGIN PASSWORD 'identity';" \
            -c "CREATE DATABASE identity OWNER identity;" \
            -c "CREATE DATABASE identity_test OWNER identity;"

      - name: pnpm -r test
        run: pnpm -r --if-present run test

      - name: pnpm -r lint
        run: pnpm -r --if-present run lint

      - name: pnpm -r typecheck
        run: pnpm -r --if-present run typecheck

  # ---------------------------------------------------------------------
  # Ethereum — Foundry. foundry.toml pins solc 0.8.35 / optimizer off to
  # match what's verifiably live on Sepolia (see foundry.toml's own
  # comment) — this job proves that pin still builds and passes.
  # ---------------------------------------------------------------------
  ethereum:
    name: chains/ethereum (Foundry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1

      - name: forge install
        working-directory: chains/ethereum
        run: forge install

      - name: forge fmt --check
        working-directory: chains/ethereum
        run: forge fmt --check

      - name: forge build
        working-directory: chains/ethereum
        run: forge build --sizes

      - name: forge test
        working-directory: chains/ethereum
        run: forge test -vvv

      - name: ABI drift check
        working-directory: chains/ethereum
        run: |
          diff <(jq -S '.abi' out/USDX.sol/USDX.json) <(jq -S . ../../shared/abi/USDX.json) || {
            echo "::error::shared/abi/USDX.json is stale — rebuild and re-copy it (see shared/abi/README.md)"
            exit 1
          }

  # ---------------------------------------------------------------------
  # Solana — Anchor/litesvm. anchor build defaults to --arch v3, which
  # litesvm 0.10.0 can't verify (InvalidAccountData) — --arch v1 is
  # required, see chains/solana/README.md#testing.
  # ---------------------------------------------------------------------
  solana:
    name: chains/solana (Anchor / litesvm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Rust toolchain
        id: rust
        run: echo "channel=$(grep channel chains/solana/rust-toolchain.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: rustfmt, clippy

      - name: cargo fmt --check
        working-directory: chains/solana
        run: cargo fmt -p usdx_bridge -- --check

      - name: Install Solana CLI + cargo build-sbf
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI
        # Pinned to 1.2.0 to match programs/usdx_bridge/Cargo.toml's
        # anchor-lang/anchor-spl version exactly — this is the version
        # verified locally throughout this repo's test suite.
        run: cargo install anchor-cli --version 1.2.0 --locked

      - name: anchor build --arch v1
        working-directory: chains/solana
        run: anchor build --arch v1 --ignore-keys

      - name: cargo clippy
        working-directory: chains/solana
        run: cargo clippy -p usdx_bridge --tests -- -D warnings

      - name: cargo test (litesvm)
        working-directory: chains/solana
        run: cargo test -p usdx_bridge

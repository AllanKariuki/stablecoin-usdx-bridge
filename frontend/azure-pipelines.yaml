trigger:
  branches:
    include:
     - dev
     - feat/pipeline-linters-and-precommit-hook

pool:
  vmImage: "ubuntu-latest"

variables:
  imageName: aats-portal
  registry: keshistaging
  group: docker-keshistaging
  runDeploy: false
  SYSTEM_ACCESSTOKEN: ${System.AccessToken}

stages:
  - stage: BuildAndPush
    jobs:
      - job: Build
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: "22.x"
            displayName: 'Install Node.js'
          - script: |
              npm install
              npm run build
            displayName: 'Build React App'
          
          - task: Docker@2
            displayName: 'Docker Login'
            inputs:
              command: login
              containerRegistry: 'dockerhub'
          
          - task: Docker@2
            displayName: 'Build and Push Docker Image'
            inputs:
              command: buildAndPush
              repository: '$(registry)/$(imageName)'
              dockerfile: './Dockerfile'
              containerRegistry: 'dockerhub'
              tags: |
                latest
                $(Build.BuildId)
            env:
              DOCKER_BUILDKIT: 1
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)

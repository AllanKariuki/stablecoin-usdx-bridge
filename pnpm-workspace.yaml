packages:
  - "frontend"
  - "shared/node/*"
  - "services/*"
allowBuilds:
  '@parcel/watcher': true
  core-js: true
  esbuild: true
  msw: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@nestjs/common@11.2.6 || 12.1.0'
  - '@nestjs/config@12.0.1'
  - '@nestjs/core@11.2.6 || 12.1.0'
  - '@nestjs/platform-express@11.2.6 || 12.1.0'
  - '@nestjs/testing@11.2.6 || 12.1.0'
  - dotenv@18.0.3
  - supertest@7.3.0
